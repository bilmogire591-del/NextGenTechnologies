<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NextGen Tech – WiFi Portal</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1e3c72; }
    iframe { width: 100%; height: 100vh; border: 0; display: block; }
    /* Optional: nice branded loader while the iframe loads */
    #loader {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      color: #fff; font-family: sans-serif; z-index: 10;
    }
    #loader .spinner {
      width: 56px; height: 56px; border: 4px solid rgba(255,215,0,0.2);
      border-top-color: #FFD700; border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loader"><div class="spinner"></div></div>
  <iframe
    id="app"
    src="https://script.google.com/macros/s/AKfycbw2VyvSg68mzYxVhRXk5hFd2_Om77Tp7cIJw4YhXo2yZQmT-Z3JmOJYaV3MX635Z4IePA/exec"
    allow="fullscreen"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads">
  </iframe>
  <script>
    // Hide loader when iframe loads
    document.getElementById('app').addEventListener('load', () => {
      const l = document.getElementById('loader');
      if (l) l.style.display = 'none';
    });
  </script>
</body>
</html>
